name: Release unsigned LiveContainer IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: brew install xcodegen
      - name: Run iOS tests
        run: bash scripts/test-ios.sh
      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Verify IPA security and structure
        run: bash scripts/verify-ipa.sh dist/ToolOne.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ToolOne-LiveContainer-${{ github.sha }}
          path: dist/ToolOne.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ToolOne.ipa \
            --verify-tag \
            --title "Tool One $GITHUB_REF_NAME" \
            --generate-notes
